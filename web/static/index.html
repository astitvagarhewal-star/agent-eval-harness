<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Eval Harness — Leaderboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: "Inter", sans-serif; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .trace-step { border-left: 2px solid #e5e7eb; margin-left: 1rem; padding-left: 1rem; }
  .tool-call { background: #f3f4f6; border-radius: 6px; padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
  .tool-result.ok { border-left: 3px solid #10b981; }
  .tool-result.bad { border-left: 3px solid #ef4444; }
  pre { white-space: pre-wrap; word-break: break-all; }
  .badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge-pass { background: #dcfce7; color: #166534; }
  .badge-fail { background: #fee2e2; color: #991b1b; }
  .badge-none { background: #e5e7eb; color: #374151; }
  .hidden { display: none; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<nav class="bg-white border-b">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
    <span class="font-semibold text-gray-900">Agent Eval Harness</span>
    <a href="#" onclick="show('leaderboard')" class="text-sm text-gray-600 hover:text-blue-600">Leaderboard</a>
    <a href="#" onclick="show('compare')" class="text-sm text-gray-600 hover:text-blue-600">Compare</a>
    <a href="#" onclick="show('runs')" class="text-sm text-gray-600 hover:text-blue-600">Runs</a>
    <a href="/docs" class="text-xs text-blue-600 underline" target="_blank">API docs</a>
  </div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-6">
  <!-- Leaderboard -->
  <section id="leaderboard" class="mb-10">
    <h2 class="text-lg font-bold mb-3">Model Leaderboard</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white border rounded-lg">
        <thead><tr class="text-left border-b text-xs text-gray-500">
          <th class="px-3 py-2">Model</th><th class="px-3 py-2">Runs</th><th class="px-3 py-2">Pass@1</th><th class="px-3 py-2">Avg Cost</th><th class="px-3 py-2">Avg Latency</th><th class="px-3 py-2">Avg Steps</th><th class="px-3 py-2">Failures</th>
        </tr></thead>
        <tbody id="lb-body" class="text-sm"></tbody>
      </table>
    </div>
    <canvas id="failureChart" class="mt-6" height="140"></canvas>
  </section>

  <!-- Compare -->
  <section id="compare" class="hidden mb-10">
    <h2 class="text-lg font-bold mb-3">Head-to-Head Matrix</h2>
    <div class="flex gap-3 mb-4">
      <input id="cmp-models" type="text" placeholder="models (comma-separated)" class="border rounded px-3 py-2 text-sm w-64">
      <input id="cmp-task" type="text" placeholder="filter task" class="border rounded px-3 py-2 text-sm w-48">
      <button onclick="loadCompare()" class="bg-blue-600 text-white px-3 py-2 rounded text-sm hover:bg-blue-700">Load</button>
    </div>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white border rounded-lg" id="cmp-table"></table>
    </div>
  </section>

  <!-- Runs -->
  <section id="runs" class="mb-10">
    <h2 class="text-lg font-bold mb-3">Recent Runs</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white border rounded-lg">
        <thead><tr class="text-left border-b text-xs text-gray-500">
          <th class="px-3 py-2">Run ID</th><th class="px-3 py-2">Task</th><th class="px-3 py-2">Model</th><th class="px-3 py-2">Result</th><th class="px-3 py-2">Steps</th><th class="px-3 py-2">Cost</th><th class="px-3 py-2">Trace</th>
        </tr></thead>
        <tbody id="runs-body" class="text-sm"></tbody>
      </table>
    </div>
  </section>

  <!-- Trace replay -->
  <section id="trace" class="hidden mt-10">
    <h2 class="text-lg font-bold mb-3">Trajectory Replay</h2>
    <div class="flex gap-3 mb-4">
      <span id="trace-run" class="font-mono text-sm bg-gray-100 px-2 py-1 rounded"></span>
      <button onclick="show('runs')" class="text-sm text-gray-600 hover:text-blue-600">← back to runs</button>
    </div>
    <div id="trace-final" class="mb-4 p-3 bg-gray-50 rounded border"></div>
    <pre id="trace-diff" class="mono text-xs bg-gray-900 text-green-400 p-3 rounded overflow-x-auto max-h-96"></pre>
    <div id="trace-steps" class="mt-4 space-y-2"></div>
  </section>
</div>

<script>
const API = "/api";
let failureChart = null;

async function getJSON(path){
  const res = await fetch(API + path);
  if (!res.ok) throw new Error("api " + res.status);
  return res.json();
}

function show(id){
  document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

function badge(pass){
  if (pass === true) return '<span class="badge badge-pass">PASS</span>';
  if (pass === false) return '<span class="badge badge-fail">FAIL</span>';
  return '<span class="badge badge-none">—</span>';
}

async function loadLeaderboard(){
  const data = await getJSON("/api/leaderboard");
  const rows = data.leaderboard.map(r => `
    <tr class="border-b">
      <td class="px-3 py-2 mono">${r.model_id}</td>
      <td class="px-3 py-2">${r.runs}</td>
      <td class="px-3 py-2">${(r.pass1*100).toFixed(1)}%</td>
      <td class="px-3 py-2 mono">$${r.avg_cost_usd}</td>
      <td class="px-3 py-2 mono">${r.avg_latency_sec}s</td>
      <td class="px-3 py-2 mono">${r.avg_steps}</td>
      <td class="px-3 py-2">${JSON.stringify(r.failure_breakdown)}</td>
    </tr>`).join("");
  document.getElementById("lb-body").innerHTML = rows;

  // failure breakdown chart (aggregate)
  const agg = {};
  for (const r of data.leaderboard){
    for (const [k,v] of Object.entries(r.failure_breakdown || {})){
      agg[k] = (agg[k] || 0) + v;
    }
  }
  const ctx = document.getElementById("failureChart").getContext("2d");
  if (failureChart) failureChart.destroy();
  failureChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: Object.keys(agg),
      datasets: [{ label: "Failures", data: Object.values(agg), backgroundColor: "#ef4444" }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });
}

async function loadCompare(){
  const models = document.getElementById("cmp-models").value;
  const task = document.getElementById("cmp-task").value;
  const qs = new URLSearchParams();
  if (models) qs.set("models", models);
  if (task) qs.set("task", task);
  const data = await getJSON("/api/compare?" + qs.toString());
  const models = data.models;
  const header = `<th class="px-3 py-2 text-xs">task</th>` + models.map(m => `<th class="px-3 py-2 text-xs mono">${m}</th>`).join("");
  const rows = data.grid.map(g => {
    const cells = models.map(m => {
      const v = g.results[m];
      return `<td class="px-3 py-2 text-center">${badge(v)}</td>`;
    }).join("");
    return `<tr class="border-b"><td class="px-3 py-2 mono">${g.task_id}</td>${cells}</tr>`;
  }).join("");
  document.getElementById("cmp-table").innerHTML = `<table class="min-w-full bg-white border rounded-lg"><thead class="border-b text-gray-500"><tr>${header}</tr></thead><tbody>${rows}</tbody></table>`;
}

async function loadRuns(){
  const data = await getJSON("/api/runs?limit=50");
  const rows = data.runs.map(r => `
    <tr class="border-b cursor-pointer hover:bg-gray-50" onclick="viewTrace('${r.run_id}')">
      <td class="px-3 py-2 mono">${r.run_id}</td>
      <td class="px-3 py-2 mono">${r.task_id}</td>
      <td class="px-3 py-2 mono">${r.model_id}</td>
      <td class="px-3 py-2">${badge(r.pass1)}</td>
      <td class="px-3 py-2 mono">${r.total_steps}</td>
      <td class="px-3 py-2 mono">$${r.total_cost_usd}</td>
      <td class="px-3 py-2 text-blue-600 text-xs underline">trace</td>
    </tr>`).join("");
  document.getElementById("runs-body").innerHTML = rows;
}

async function viewTrace(run_id){
  const data = await getJSON("/api/runs/" + run_id + "/trace");
  document.getElementById("trace-run").textContent = run_id + " · " + data.model_id + " · " + data.task_id;
  document.getElementById("trace-final").innerHTML = `<strong>Final answer:</strong> ${data.final_answer || "(none)"}`;
  document.getElementById("trace-diff").textContent = data.final_diff || "(no diff)";
  const steps = (data.trajectory && data.trajectory.steps) || [];
  const html = steps.map(s => {
    const tc = s.tool_call;
    const tr = s.tool_result;
    let callHtml = "";
    if (tc) {
      callHtml = `<div class="tool-call"><div class="text-xs text-gray-500 mono">${tc.name}</div><pre class="text-xs">${JSON.stringify(tc.arguments, null, 1).slice(0, 400)}</pre></div>`;
    }
    let resHtml = "";
    if (tr) {
      const cls = tr.ok ? "tool-result ok" : "tool-result bad";
      resHtml = `<div class="${cls}"><div class="text-xs text-gray-500">${tr.ok ? "result" : "error"}</div><pre class="text-xs">${(tr.ok ? tr.output : tr.error || "").slice(0, 600)}</pre></div>`;
    }
    return `<div class="trace-step"><div class="text-xs text-gray-500 mb-1">step ${s.step} · ${s.finish_reason}</div>${callHtml}${resHtml}</div>`;
  }).join("");
  document.getElementById("trace-steps").innerHTML = html;
  show("trace");
}

loadLeaderboard();
loadRuns();
</script>
</body>
</html>
